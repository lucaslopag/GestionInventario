<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación | Sistema de Inventario</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-centrada">

    <div class="tarjeta centro">
        <div id="loading">
            <h1 class="brand">Verificando...</h1>
            <p class="subtitle">Estamos procesando tu enlace de confirmación.</p>
        </div>

        <div class="oculto" id="success">
            <h1 class="texto-ok">¡Cuenta Activada!</h1>
            <p class="subtitle">Tu cuenta ha sido confirmada con éxito. Ya puedes empezar a gestionar tu inventario.</p>
            <a href="index.html"><button>Ir al Login</button></a>
        </div>

        <div class="oculto" id="error">
            <h1 class="texto-error">Error de Enlace</h1>
            <p class="subtitle" id="errorMsg">El token de confirmación no es válido o ha expirado.</p>
            <a href="index.html">Volver al inicio</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const status = urlParams.get('status');
            const reason = urlParams.get('reason');
            const token = urlParams.get('token');
            const loading = document.getElementById('loading');
            const success = document.getElementById('success');
            const error = document.getElementById('error');

            // Si el backend nos redirigió con status=ok
            if (status === 'ok') {
                loading.style.display = 'none';
                success.style.display = 'block';
                return;
            }
            
            // Si el backend nos redirigió con status=error
            if (status === 'error') {
                loading.style.display = 'none';
                document.getElementById('errorMsg').textContent = reason === 'expired' ? 'El token ha expirado.' : 'El token no es válido o ya fue usado.';
                error.style.display = 'block';
                return;
            }

            // Si el enlace contiene el token directamente, hacemos la validación nosotros (flujo alternativo)
            if (!token) {
                loading.style.display = 'none';
                error.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`http://localhost:8080/api/auth/confirmar?token=${token}`);
                const text = await response.text();

                loading.style.display = 'none';

                if (response.ok && (text.toLowerCase().includes('éxito') || text.toLowerCase().includes('confirmad'))) {
                    success.style.display = 'block';
                } else {
                    document.getElementById('errorMsg').textContent = text || 'El token no es válido o ha expirado.';
                    error.style.display = 'block';
                }

            } catch (err) {
                loading.style.display = 'none';
                document.getElementById('errorMsg').textContent = 'No se pudo conectar con el servidor.';
                error.style.display = 'block';
            }
        });
    </script>
</body>
</html>
