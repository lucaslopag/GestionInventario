<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario | Sistema de Inventario</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="display: block;">

    <div class="dashboard-container">
        <aside class="sidebar">
            <div id="sidebarUserProfile" class="sidebar-profile-wrapper"></div>
            <nav style="margin-top: 1.5rem;">
                <a href="dashboard.html" class="nav-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="productos.html" class="nav-link"><i data-lucide="package"></i> Productos</a>
                <a href="proveedores.html" class="nav-link"><i data-lucide="truck"></i> Proveedores</a>
                <a href="inventario.html" class="nav-link active"><i data-lucide="refresh-cw"></i> Inventario</a>
                <a href="historial.html" class="nav-link"><i data-lucide="history"></i> Historial</a>
                <a href="usuarios.html" class="nav-link" id="navUsuarios" style="display:none;"><i data-lucide="users"></i> Usuarios</a>
            </nav>
        </aside>

        <main class="main-content">
            <header style="margin-bottom: 2rem;">
                <h2>Control de Stock</h2>
                <p style="color: var(--text-secondary);">Realiza ajustes de inventario, entradas y salidas de mercancía.</p>
            </header>

            <!-- Filtros -->
            <div class="filters-bar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar producto...">
                </div>
                <select id="filterNivel" class="filter-select">
                    <option value="">Todos los niveles</option>
                    <option value="optimo">Óptimo (≥10)</option>
                    <option value="bajo">Stock Bajo (1–9)</option>
                    <option value="agotado">Agotado (0)</option>
                </select>
                <select id="filterCategoria" class="filter-select">
                    <option value="">Todas las categorías</option>
                </select>
                <select id="filterOrden" class="filter-select">
                    <option value="">Ordenar por</option>
                    <option value="stock-asc">Stock: menor primero</option>
                    <option value="stock-desc">Stock: mayor primero</option>
                    <option value="nombre">Nombre A–Z</option>
                </select>
            </div>

            <p id="resultCount" style="color: var(--text-secondary); font-size:0.9rem; margin-bottom: 1rem;"></p>

            <!-- Tabla -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Stock Actual</th>
                            <th>Nivel</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Ajuste de Stock -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Ajustar Stock: <span id="targetProdName" style="color: var(--accent);"></span></h3>
                <button class="close-modal" id="closeModalBtn">&times;</button>
            </div>
            <div id="modalMsg" class="alert" style="margin-bottom:1rem;"></div>
            <form id="adjustmentForm">
                <input type="hidden" id="targetProdId">

                <div class="form-group">
                    <label>Tipo de Movimiento</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 0.5rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; background: rgba(0,230,118,0.05); padding: 1rem; border-radius: 12px; border: 1px solid rgba(0,230,118,0.2);">
                            <input type="radio" name="moveType" value="IN" checked style="width: auto;"> Entrada (+)
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; background: rgba(255,75,92,0.05); padding: 1rem; border-radius: 12px; border: 1px solid rgba(255,75,92,0.2);">
                            <input type="radio" name="moveType" value="OUT" style="width: auto;"> Salida (-)
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Cantidad</label>
                    <input type="number" id="adjQuantity" required min="1" placeholder="Ej. 10">
                </div>

                <div class="form-group" id="provGroup">
                    <label>Proveedor *</label>
                    <select id="adjProveedor" required>
                        <option value="">-- Selecciona un proveedor --</option>
                    </select>
                </div>

                <div id="stockAlert" style="display:none; background: rgba(255,75,92,0.1); color: var(--error); border: 1px solid rgba(255,75,92,0.3); border-radius: 12px; padding: 0.8rem 1rem; font-size:0.9rem; margin-bottom:1rem;"></div>

                <button type="submit">Confirmar Ajuste</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
        lucide.createIcons();

        let allProducts = [];

        const inventoryBody = document.getElementById('inventoryBody');
        const searchInput   = document.getElementById('searchInput');
        const filterNivel   = document.getElementById('filterNivel');
        const filterCat     = document.getElementById('filterCategoria');
        const filterOrden   = document.getElementById('filterOrden');
        const modal         = document.getElementById('modalOverlay');
        const modalMsg      = document.getElementById('modalMsg');

        function getFiltered() {
            const term  = searchInput.value.toLowerCase();
            const nivel = filterNivel.value;
            const cat   = filterCat.value;
            const orden = filterOrden.value;

            let data = allProducts.filter(p => {
                const stock  = p.cantidadDisponible ?? p.stock ?? 0;
                const nombre = (p.nombreProducto ?? p.nombre ?? '').toLowerCase();
                const catVal = (p.categoria ?? '').toLowerCase();

                const matchTerm  = !term  || nombre.includes(term) || catVal.includes(term);
                const matchCat   = !cat   || (p.categoria ?? '') === cat;

                let matchNivel = true;
                if (nivel === 'optimo')  matchNivel = stock >= 10;
                if (nivel === 'bajo')    matchNivel = stock > 0 && stock < 10;
                if (nivel === 'agotado') matchNivel = stock === 0;

                return matchTerm && matchCat && matchNivel;
            });

            if (orden === 'stock-asc')  data.sort((a, b) => (a.cantidadDisponible ?? 0) - (b.cantidadDisponible ?? 0));
            if (orden === 'stock-desc') data.sort((a, b) => (b.cantidadDisponible ?? 0) - (a.cantidadDisponible ?? 0));
            if (orden === 'nombre')     data.sort((a, b) => (a.nombreProducto ?? a.nombre ?? '').localeCompare(b.nombreProducto ?? b.nombre ?? ''));

            return data;
        }

        function renderInventory(data) {
            inventoryBody.innerHTML = '';
            document.getElementById('resultCount').textContent = `Mostrando ${data.length} de ${allProducts.length} productos`;

            if (data.length === 0) {
                inventoryBody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-secondary); padding: 2rem;">No se encontraron productos con los filtros aplicados.</td></tr>';
                return;
            }
            data.forEach(p => {
                const stock      = p.cantidadDisponible ?? p.stock ?? 0;
                const badgeClass = stock === 0 ? 'badge-danger' : stock < 10 ? 'badge-warning' : 'badge-stock';
                const levelText  = stock === 0 ? 'Agotado' : stock < 10 ? 'Bajo' : 'Óptimo';
                const nombre     = p.nombreProducto ?? p.nombre ?? `Producto #${p.productoId ?? p.id}`;
                const categoria  = p.categoria ?? '—';

                inventoryBody.innerHTML += `
                    <tr>
                        <td>#${p.productoId ?? p.id}</td>
                        <td style="font-weight: 600;">${nombre}</td>
                        <td>${categoria}</td>
                        <td style="font-size: 1.2rem; font-weight: 700;">${stock}</td>
                        <td><span class="badge ${badgeClass}">${levelText}</span></td>
                        <td>
                            <button onclick="openAdjustment(${p.productoId ?? p.id}, '${nombre.replace(/'/g,"\\'")}', ${stock})"
                                style="width:auto; padding:0.4rem 0.8rem; background: var(--accent); color: #0b0f1a; border:none; border-radius:8px; cursor:pointer; font-weight:600;">
                                Ajustar
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        function applyFilters() { renderInventory(getFiltered()); }

        let allProveedores = [];

        async function loadInventory() {
            inventoryBody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 2rem; color: var(--text-secondary);">Cargando...</td></tr>';
            try {
                const [productosRes, stockRes, proveedoresRes] = await Promise.allSettled([
                    api.get('/productos'),
                    api.get('/inventario/stock'),
                    api.get('/proveedores')
                ]);

                let productos = [];
                let stocks = [];

                if (productosRes.status === 'fulfilled' && !productosRes.value.error) {
                    productos = Array.isArray(productosRes.value) ? productosRes.value : (productosRes.value.content ?? []);
                }
                if (stockRes.status === 'fulfilled' && !stockRes.value.error) {
                    stocks = Array.isArray(stockRes.value) ? stockRes.value : (stockRes.value.content ?? []);
                }
                if (proveedoresRes.status === 'fulfilled' && !proveedoresRes.value.error) {
                    allProveedores = Array.isArray(proveedoresRes.value) ? proveedoresRes.value : (proveedoresRes.value.content ?? []);
                }

                allProducts = productos.map(p => {
                    const s = stocks.find(x => x.productoId === p.id);
                    return {
                        ...p,
                        productoId: p.id,
                        cantidadDisponible: s ? s.cantidadDisponible : 0
                    };
                });

                const cats = [...new Set(allProducts.map(p => p.categoria).filter(Boolean))].sort();
                filterCat.innerHTML = '<option value="">Todas las categorías</option>';
                cats.forEach(c => { filterCat.innerHTML += `<option value="${c}">${c}</option>`; });

                const provSelect = document.getElementById('adjProveedor');
                if(provSelect) {
                    provSelect.innerHTML = '<option value="">Ninguno / No aplica</option>';
                    allProveedores.forEach(prov => {
                        provSelect.innerHTML += `<option value="${prov.id}">${prov.nombre}</option>`;
                    });
                }

                renderInventory(allProducts);
            } catch {
                inventoryBody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--error); padding:2rem;">Error al cargar inventario.</td></tr>';
            }
        }

        function openAdjustment(id, name, currentStock) {
            document.getElementById('targetProdId').value = id;
            document.getElementById('targetProdName').textContent = name;
            document.getElementById('adjQuantity').value = '';
            document.getElementById('adjProveedor').value = '';
            document.getElementById('stockAlert').style.display = 'none';
            modalMsg.style.display = 'none';

            const stockAlert = document.getElementById('stockAlert');
            const provGroup = document.getElementById('provGroup');
            
            if (currentStock === 0) {
                stockAlert.textContent = `⚠ Stock actual: 0 unidades. Solo se permite entrada.`;
                stockAlert.style.display = 'block';
                document.querySelector('input[name="moveType"][value="OUT"]').disabled = true;
                document.querySelector('input[name="moveType"][value="IN"]').checked = true;
                provGroup.style.display = 'block';
            } else {
                stockAlert.textContent = `Stock actual: ${currentStock} unidades.`;
                stockAlert.style.display = 'block';
                stockAlert.style.background = 'rgba(0,210,255,0.05)';
                stockAlert.style.color = 'var(--accent)';
                stockAlert.style.borderColor = 'rgba(0,210,255,0.2)';
                document.querySelector('input[name="moveType"][value="OUT"]').disabled = false;
                provGroup.style.display = document.querySelector('input[name="moveType"]:checked').value === 'IN' ? 'block' : 'none';
            }
            modal.style.display = 'flex';
        }

        document.querySelectorAll('input[name="moveType"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                document.getElementById('provGroup').style.display = e.target.value === 'IN' ? 'block' : 'none';
            });
        });

        document.getElementById('closeModalBtn').onclick = () => modal.style.display = 'none';
        window.addEventListener('click', e => { if (e.target === modal) modal.style.display = 'none'; });

        document.getElementById('adjustmentForm').onsubmit = async (e) => {
            e.preventDefault();
            const productoId  = parseInt(document.getElementById('targetProdId').value);
            const cantidad    = parseInt(document.getElementById('adjQuantity').value);
            const tipo        = document.querySelector('input[name="moveType"]:checked').value;
            const provIdStr   = document.getElementById('adjProveedor').value;
            const proveedorId = provIdStr ? parseInt(provIdStr) : null;
            const endpoint    = tipo === 'IN' ? '/inventario/entrada' : '/inventario/salida';

            // Proveedor obligatorio en entradas
            if (tipo === 'IN' && !proveedorId) {
                modalMsg.textContent = 'Debes seleccionar un proveedor para registrar una entrada.';
                modalMsg.className = 'alert alert-error';
                modalMsg.style.display = 'block';
                return;
            }

            const payload = { productoId, cantidad };
            if (proveedorId) payload.proveedorId = proveedorId;

            const res = await api.post(endpoint, payload);
            if (res && res.error) {
                modalMsg.textContent = res.message || 'Error al registrar movimiento.';
                modalMsg.className = 'alert alert-error';
                modalMsg.style.display = 'block';
                return;
            }
            modal.style.display = 'none';
            await loadInventory();
        };

        searchInput.addEventListener('input', applyFilters);
        filterNivel.addEventListener('change', applyFilters);
        filterCat.addEventListener('change', applyFilters);
        filterOrden.addEventListener('change', applyFilters);

        loadInventory();
    </script>
</body>
</html>
