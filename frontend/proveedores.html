<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores | Sistema de Inventario</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div id="sidebarUserProfile" class="sidebar-profile-wrapper"></div>
            <nav class="mt-1">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="productos.html" class="nav-link">Productos</a>
                <a href="proveedores.html" class="nav-link active">Proveedores</a>
                <a href="inventario.html" class="nav-link">Inventario</a>
                <a href="historial.html" class="nav-link">Historial</a>
                <a href="usuarios.html" class="nav-link oculto" id="navUsuarios">Usuarios</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="mb-2">
                <h2>Gestión de Proveedores</h2>
                <p class="texto-suave">Administra tus contactos y socios comerciales.</p>
            </header>

            <!-- Filtros -->
            <div class="filters-bar fila">
                <div class="search-box flex-1">
                    <input type="text" id="searchInput" placeholder="Buscar por nombre, email o dirección...">
                </div>
                <select id="filterOrden" class="filter-select">
                    <option value="">Ordenar por</option>
                    <option value="nombre">Nombre A–Z</option>
                    <option value="email">Email A–Z</option>
                </select>
                <div id="colToggleContainer"></div>
                <button class="btn-add nowrap ml-auto" id="openModalBtn">Nuevo Proveedor</button>
            </div>

            <p class="texto-suave texto-chico mb-1" id="resultCount"></p>

            <!-- Tabla -->
            <div class="table-container">
                <table id="providersTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Dirección</th>
                            <th id="accionesHeader">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="providersBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Nuevo/Editar Proveedor -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Añadir Proveedor</h3>
                <button class="close-modal" id="closeModalBtn">Cerrar</button>
            </div>
            <div id="modalMsg" class="alert mb-1"></div>
            <form id="providerForm">
                <input type="hidden" id="provId">

                <div class="form-group">
                    <label>Nombre del Proveedor *</label>
                    <input type="text" id="provName" required placeholder="Ej. Tech Solutions S.L.">
                </div>

                <div class="form-group">
                    <label>Email de Contacto *</label>
                    <input type="email" id="provEmail" required placeholder="contacto@empresa.com">
                </div>

                <div class="form-group">
                    <label>Dirección *</label>
                    <input type="text" id="provDireccion" required placeholder="Ej. Calle Mayor 1, 28001 Madrid">
                </div>

                <button type="submit" id="submitBtn">Registrar Proveedor</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/tableUtils.js"></script>
    <script>

        let isAdmin = false;
        const userRaw = localStorage.getItem('user');
        if (userRaw) {
            try {
                const u = JSON.parse(userRaw);
                isAdmin = (u.rol || '').toUpperCase() === 'ADMIN';
            } catch(e) {}
        }

        let allProviders = [];

        const providersBody = document.getElementById('providersBody');
        const searchInput   = document.getElementById('searchInput');
        const filterOrden   = document.getElementById('filterOrden');
        const modal         = document.getElementById('modalOverlay');
        const modalMsg      = document.getElementById('modalMsg');
        const providerForm  = document.getElementById('providerForm');

        if (!isAdmin) {
            document.getElementById('openModalBtn')?.remove();
            document.getElementById('accionesHeader')?.remove();
        }

        function getFiltered() {
            const term  = searchInput.value.toLowerCase();
            const orden = filterOrden.value;

            let data = allProviders.filter(p =>
                !term ||
                (p.nombre || '').toLowerCase().includes(term) ||
                (p.email || '').toLowerCase().includes(term) ||
                (p.direccion || '').toLowerCase().includes(term)
            );

            if (orden === 'nombre') data.sort((a, b) => a.nombre.localeCompare(b.nombre));
            if (orden === 'email')  data.sort((a, b) => (a.email || '').localeCompare(b.email || ''));
            return data;
        }

        function renderProviders(data) {
            providersBody.innerHTML = '';
            document.getElementById('resultCount').textContent = `Mostrando ${data.length} de ${allProviders.length} proveedores`;

            if (data.length === 0) {
                providersBody.innerHTML = '<tr><td class="mensaje" colspan="5">No se encontraron proveedores.</td></tr>';
                return;
            }
            data.forEach(p => {
                providersBody.innerHTML += `
                    <tr>
                        <td>#${p.id}</td>
                        <td class="negrita">${esc(p.nombre)}</td>
                        <td class="texto-acento">${esc(p.email)}</td>
                        <td>${esc(p.direccion ?? '-')}</td>
                        ${isAdmin ? `
                        <td><div class="fila">
                            <button onclick="editProvider(${p.id})" class="btn-icon btn-edit" title="Editar">Editar</button>
                            <button onclick="deleteProvider(${p.id})" class="btn-icon btn-danger" title="Eliminar">Eliminar</button></div></td>` : ''}
                    </tr>
                `;
            });
        }

        function applyFilters() { renderProviders(getFiltered()); }

        async function loadProviders() {
            providersBody.innerHTML = '<tr><td class="mensaje" colspan="5">Cargando...</td></tr>';
            try {
                const data = await api.get('/proveedores');
                allProviders = Array.isArray(data) ? data : (data.content ?? []);
                renderProviders(allProviders);
            } catch {
                providersBody.innerHTML = '<tr><td class="mensaje mensaje-error" colspan="5">Error al cargar proveedores.</td></tr>';
            }
        }

        function editProvider(id) {
            const p = allProviders.find(x => x.id === id);
            if (!p) return;
            document.getElementById('modalTitle').textContent = 'Editar Proveedor';
            document.getElementById('provId').value = p.id;
            document.getElementById('provName').value = p.nombre;
            document.getElementById('provEmail').value = p.email;
            document.getElementById('provDireccion').value = p.direccion ?? '';
            document.getElementById('submitBtn').textContent = 'Actualizar Proveedor';
            modalMsg.style.display = 'none';
            modal.style.display = 'flex';
        }

        async function deleteProvider(id) {
            if (!confirm('¿Seguro que quieres eliminar este proveedor?')) return;
            const res = await api.delete(`/proveedores/${id}`);
            if (res && res.error) { alert(res.message); return; }
            await loadProviders();
        }

        document.getElementById('openModalBtn').onclick = () => {
            document.getElementById('modalTitle').textContent = 'Añadir Proveedor';
            document.getElementById('provId').value = '';
            document.getElementById('submitBtn').textContent = 'Registrar Proveedor';
            providerForm.reset();
            modalMsg.style.display = 'none';
            modal.style.display = 'flex';
        };
        document.getElementById('closeModalBtn').onclick = () => modal.style.display = 'none';
        window.addEventListener('click', e => { if (e.target === modal) modal.style.display = 'none'; });

        providerForm.onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('provId').value;
            const body = {
                nombre:    document.getElementById('provName').value.trim(),
                email:     document.getElementById('provEmail').value.trim(),
                direccion: document.getElementById('provDireccion').value.trim()
            };
            const res = id
                ? await api.put(`/proveedores/${id}`, body)
                : await api.post('/proveedores', body);

            if (res && res.error) {
                modalMsg.textContent = res.message || 'Error al guardar el proveedor.';
                modalMsg.className = 'alert alert-error';
                modalMsg.style.display = 'block';
                return;
            }
            modal.style.display = 'none';
            providerForm.reset();
            await loadProviders();
        };

        searchInput.addEventListener('input', applyFilters);
        filterOrden.addEventListener('change', applyFilters);

        loadProviders().then(() => {
            initTableUtils('providersTable', 'colToggleContainer');
            observeTableChanges('providersTable', 'colToggleContainer');
        });
    </script>
</body>
</html>
