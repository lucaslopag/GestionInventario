<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores | Sistema de Inventario</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="display: block;">

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h1 style="font-size: 1.5rem; margin-bottom: 2rem;">
                <span class="brand">Inventary</span>
            </h1>
            
            <nav>
                <a href="dashboard.html" class="nav-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="productos.html" class="nav-link"><i data-lucide="package"></i> Productos</a>
                <a href="proveedores.html" class="nav-link active"><i data-lucide="users"></i> Proveedores</a>
                <a href="inventario.html" class="nav-link"><i data-lucide="refresh-cw"></i> Inventario</a>
                <a href="historial.html" class="nav-link"><i data-lucide="history"></i> Historial</a>
            </nav>

            <div style="margin-top: auto;">
                <a href="index.html" class="nav-link" style="color: var(--error);"><i data-lucide="log-out"></i> Cerrar Sesión</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="margin-bottom: 3rem;">
                <h2>Gestión de Proveedores</h2>
                <p style="color: var(--text-secondary);">Administra tus contactos y socios comerciales.</p>
            </header>

            <!-- Acciones -->
            <div class="controls-row">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar por nombre o ciudad...">
                </div>
                <button class="btn-add" id="openModalBtn">+ Nuevo Proveedor</button>
            </div>

            <!-- Tabla de Proveedores -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Empresa / Nombre</th>
                            <th>Contacto Principal</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                            <th>Ciudad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="providersBody">
                        <!-- Se llenará con JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal para Nuevo Proveedor -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Añadir Proveedor</h3>
                <button class="close-modal" id="closeModalBtn">&times;</button>
            </div>
            <form id="providerForm">
                <div class="form-group">
                    <label for="provName">Nombre de la Empresa</label>
                    <input type="text" id="provName" required placeholder="Ej. Tech Solutions S.L.">
                </div>
                <div class="form-group">
                    <label for="provContact">Persona de Contacto</label>
                    <input type="text" id="provContact" required placeholder="Ej. Carlos García">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="provPhone">Teléfono</label>
                        <input type="tel" id="provPhone" required placeholder="+34 600 000 000">
                    </div>
                    <div class="form-group">
                        <label for="provCity">Ciudad</label>
                        <input type="text" id="provCity" required placeholder="Ej. Madrid">
                    </div>
                </div>
                <div class="form-group">
                    <label for="provEmail">Email de Contacto</label>
                    <input type="email" id="provEmail" required placeholder="contacto@empresa.com">
                </div>
                <button type="submit">Registrar Proveedor</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Datos de ejemplo (Mock)
        let providers = [
            { id: 1, nombre: 'Distribuciones Norte', contacto: 'Ana Martínez', telefono: '912 345 678', email: 'ana@norte.com', ciudad: 'Madrid' },
            { id: 2, nombre: 'Global Tech', contacto: 'Luis Rodríguez', telefono: '934 567 890', email: 'luis@globaltech.es', ciudad: 'Barcelona' },
            { id: 3, nombre: 'Suministros Industriales', contacto: 'Marta Sanz', telefono: '965 432 109', email: 'ventas@sumindustria.com', ciudad: 'Valencia' }
        ];

        const providersBody = document.getElementById('providersBody');
        const searchInput = document.getElementById('searchInput');
        const modal = document.getElementById('modalOverlay');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const providerForm = document.getElementById('providerForm');

        function renderProviders(data) {
            providersBody.innerHTML = '';
            data.forEach(p => {
                providersBody.innerHTML += `
                    <tr>
                        <td>#${p.id}</td>
                        <td style="font-weight: 600;">${p.nombre}</td>
                        <td>${p.contacto}</td>
                        <td>${p.telefono}</td>
                        <td>${p.email}</td>
                        <td><span class="badge badge-stock">${p.ciudad}</span></td>
                        <td>
                            <button style="width: auto; padding: 0.4rem 0.8rem; background: none; color: var(--accent); border: 1px solid var(--accent);">Editar</button>
                        </td>
                    </tr>
                `;
            });
        }

        // Buscador
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = providers.filter(p => 
                p.nombre.toLowerCase().includes(term) || 
                p.ciudad.toLowerCase().includes(term)
            );
            renderProviders(filtered);
        });

        // Modal Logic
        openModalBtn.onclick = () => modal.style.display = 'flex';
        closeModalBtn.onclick = () => modal.style.display = 'none';
        window.onclick = (event) => { if (event.target == modal) modal.style.display = 'none'; }

        // Form Submit
        providerForm.onsubmit = (e) => {
            e.preventDefault();
            const newProv = {
                id: providers.length + 1,
                nombre: document.getElementById('provName').value,
                contacto: document.getElementById('provContact').value,
                telefono: document.getElementById('provPhone').value,
                email: document.getElementById('provEmail').value,
                ciudad: document.getElementById('provCity').value
            };
            providers.push(newProv);
            renderProviders(providers);
            modal.style.display = 'none';
            providerForm.reset();
        };

        // Inicializar
        renderProviders(providers);
        lucide.createIcons();
    </script>
</body>
</html>
