<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sistema de Inventario</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="glass-card">
        <h1>Bienvenido a <span class="brand">Inventary</span></h1>
        <p class="subtitle">Gestiona tu stock con tecnología inteligente</p>

        <div id="alert" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="nombre@ejemplo.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" id="btnSubmit">Iniciar Sesión</button>
        </form>

        <div class="footer-text">
            ¿No tienes cuenta? <a href="register.html">Regístrate gratis</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alert = document.getElementById('alert');
            const btnSubmit = document.getElementById('btnSubmit');

            try {
                btnSubmit.disabled = true;
                btnSubmit.textContent = 'Iniciando sesión...';
                
                const response = await api.post('/auth/login', { email, password });

                if (response.token) {
                    localStorage.setItem('token', response.token);
                    
                    // Guardamos los datos del usuario construyendo el objeto que esperan las otras páginas
                    const userData = {
                        nombre: response.nombre,
                        email: response.email,
                        rol: response.rol
                    };
                    localStorage.setItem('user', JSON.stringify(userData));
                    
                    window.location.href = 'dashboard.html';
                } else {
                    alert.className = 'alert alert-error';
                    alert.textContent = response.message || 'Credenciales incorrectas';
                    alert.style.display = 'block';
                }

            } catch (err) {
                alert.className = 'alert alert-error';
                alert.textContent = 'Error al conectar con el servidor. Verifica que el Gateway esté encendido.';
                alert.style.display = 'block';
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Iniciar Sesión';
            }
        });
    </script>
</body>
</html>
