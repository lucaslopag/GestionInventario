<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sistema de Inventario</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="glass-card">
        <h1>Bienvenido a <span class="brand">Inventary</span></h1>
        <p class="subtitle">Gestiona tu stock con tecnología inteligente</p>

        <div id="alert" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="nombre@ejemplo.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" id="btnSubmit">Iniciar Sesión</button>
        </form>

        <div class="footer-text">
            ¿No tienes cuenta? <a href="register.html">Regístrate gratis</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alert = document.getElementById('alert');

            try {
                // Mock de login para el Día 2
                console.log('Login intent:', { email, password });
                
                alert.className = 'alert alert-error';
                alert.textContent = 'El sistema aún no está conectado al backend. Pero el diseño ya funciona.';
                alert.style.display = 'block';

            } catch (err) {
                alert.className = 'alert alert-error';
                alert.textContent = 'Error al conectar con el servidor';
                alert.style.display = 'block';
            }
        });
    </script>
</body>
</html>
