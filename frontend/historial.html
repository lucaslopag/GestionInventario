<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial | Sistema de Inventario</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="display: block;">

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h1 style="font-size: 1.5rem; margin-bottom: 2rem;">
                <span class="brand">Inventary</span>
            </h1>
            
            <nav>
                <a href="dashboard.html" class="nav-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="productos.html" class="nav-link"><i data-lucide="package"></i> Productos</a>
                <a href="proveedores.html" class="nav-link"><i data-lucide="users"></i> Proveedores</a>
                <a href="inventario.html" class="nav-link"><i data-lucide="refresh-cw"></i> Inventario</a>
                <a href="historial.html" class="nav-link active"><i data-lucide="history"></i> Historial</a>
            </nav>

            <div style="margin-top: auto;">
                <a href="index.html" class="nav-link" style="color: var(--error);"><i data-lucide="log-out"></i> Cerrar Sesión</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="margin-bottom: 3rem;">
                <h2>Historial de Actividad</h2>
                <p style="color: var(--text-secondary);">Registro detallado de todos los movimientos y cambios en el sistema.</p>
            </header>

            <!-- Filtros -->
            <div class="controls-row">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Filtrar por producto o acción...">
                </div>
                <div style="display: flex; gap: 1rem;">
                    <select id="typeFilter" style="background: var(--card-bg); color: white; border: 1px solid var(--border); padding: 0.8rem; border-radius: 12px; outline: none; cursor: pointer;">
                        <option value="ALL">Todos los tipos</option>
                        <option value="IN">Entradas</option>
                        <option value="OUT">Salidas</option>
                        <option value="CREATE">Creaciones</option>
                    </select>
                </div>
            </div>

            <!-- Tabla de Historial -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha y Hora</th>
                            <th>Usuario</th>
                            <th>Acción</th>
                            <th>Producto / Entidad</th>
                            <th>Cantidad</th>
                            <th>Motivo</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <!-- Se llenará con JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Datos de ejemplo (Mock)
        const historyData = [
            { id: 1, fecha: '2024-05-13 09:45', usuario: 'Alejandro', accion: 'IN', entidad: 'Monitor 4K LG', cantidad: '+10', motivo: 'Compra a proveedor' },
            { id: 2, fecha: '2024-05-13 08:20', usuario: 'Lucas', accion: 'OUT', entidad: 'Teclado Mecánico', cantidad: '-2', motivo: 'Venta Directa' },
            { id: 3, fecha: '2024-05-12 18:10', usuario: 'Admin', accion: 'CREATE', entidad: 'Ratón Inalámbrico', cantidad: '-', motivo: 'Nuevo producto en catálogo' },
            { id: 4, fecha: '2024-05-12 15:30', usuario: 'Alejandro', accion: 'OUT', entidad: 'Memoria RAM 16GB', cantidad: '-5', motivo: 'Ajuste por rotura' },
            { id: 5, fecha: '2024-05-12 11:00', usuario: 'Ángel', accion: 'IN', entidad: 'Teclado Mecánico', cantidad: '+15', motivo: 'Reposición' }
        ];

        const historyBody = document.getElementById('historyBody');
        const searchInput = document.getElementById('searchInput');
        const typeFilter = document.getElementById('typeFilter');

        function renderHistory(data) {
            historyBody.innerHTML = '';
            data.forEach(h => {
                let actionBadge = '';
                switch(h.accion) {
                    case 'IN': actionBadge = '<span class="badge badge-stock">ENTRADA</span>'; break;
                    case 'OUT': actionBadge = '<span class="badge badge-danger">SALIDA</span>'; break;
                    case 'CREATE': actionBadge = '<span class="badge badge-warning">CREACIÓN</span>'; break;
                }

                historyBody.innerHTML += `
                    <tr>
                        <td style="color: var(--text-secondary); font-size: 0.9rem;">${h.fecha}</td>
                        <td style="font-weight: 600;">${h.usuario}</td>
                        <td>${actionBadge}</td>
                        <td>${h.entidad}</td>
                        <td style="font-weight: 700; color: ${h.cantidad.startsWith('+') ? 'var(--success)' : (h.cantidad.startsWith('-') ? 'var(--error)' : 'white')}">${h.cantidad}</td>
                        <td style="font-style: italic; color: var(--text-secondary);">${h.motivo}</td>
                    </tr>
                `;
            });
        }

        // Filtros combinados
        function filterData() {
            const term = searchInput.value.toLowerCase();
            const type = typeFilter.value;

            const filtered = historyData.filter(h => {
                const matchesTerm = h.entidad.toLowerCase().includes(term) || h.motivo.toLowerCase().includes(term);
                const matchesType = type === 'ALL' || h.accion === type;
                return matchesTerm && matchesType;
            });

            renderHistory(filtered);
        }

        searchInput.addEventListener('input', filterData);
        typeFilter.addEventListener('change', filterData);

        // Inicializar
        renderHistory(historyData);
        lucide.createIcons();
    </script>
</body>
</html>
