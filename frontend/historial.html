<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial | Sistema de Inventario</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div id="sidebarUserProfile" class="sidebar-profile-wrapper"></div>
            <nav class="mt-1">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="productos.html" class="nav-link">Productos</a>
                <a href="proveedores.html" class="nav-link">Proveedores</a>
                <a href="inventario.html" class="nav-link">Inventario</a>
                <a href="historial.html" class="nav-link active">Historial</a>
                <a href="usuarios.html" class="nav-link oculto" id="navUsuarios">Usuarios</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="mb-2">
                <h2>Historial de Auditoría</h2>
                <p class="texto-suave">Registro completo de todos los eventos y cambios del sistema.</p>
            </header>

            <!-- Filtros principales -->
            <div class="filters-bar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar por usuario, producto o detalle...">
                </div>
                <select id="filterAccion" class="filter-select">
                    <option value="">Todas las acciones</option>
                    <option value="ENTRADA">Entradas</option>
                    <option value="SALIDA">Salidas</option>
                    <option value="CREAR">Creaciones</option>
                    <option value="ACTUALIZAR">Actualizaciones</option>
                    <option value="ELIMINAR">Eliminaciones</option>
                    <option value="LOGIN">Logins</option>
                    <option value="REGISTRO">Registros</option>
                </select>
                <select id="filterServicio" class="filter-select">
                    <option value="">Todos los servicios</option>
                    <option value="INVENTORY">Inventario</option>
                    <option value="CATALOG">Catálogo</option>
                    <option value="USERS">Usuarios</option>
                </select>
                <div class="ml-auto" id="colToggleContainer"></div>
            </div>

            <!-- Filtros secundarios: fechas y usuario -->
            <div class="filters-bar">
                <div class="form-group fila sin-margen">
                    <label class="sin-margen nowrap texto-suave texto-chico">Desde</label>
                    <input type="date" id="filterDesde" class="filter-input-date">
                </div>
                <div class="form-group fila sin-margen">
                    <label class="sin-margen nowrap texto-suave texto-chico">Hasta</label>
                    <input type="date" id="filterHasta" class="filter-input-date">
                </div>
                <div class="search-box max-240">
                    <input type="text" id="filterUsuario" placeholder="Filtrar por email de usuario...">
                </div>
                <button id="btnLimpiarFiltros" class="btn-secondary nowrap">
                    Limpiar filtros
                </button>
                <button id="btnRecargar" class="btn-secondary nowrap">
                    Recargar
                </button>
            </div>

            <!-- Info de resultados + paginación -->
            <div class="fila fila-entre mb-1">
                <p class="texto-suave texto-chico" id="resultCount"></p>
                <div class="fila">
                    <button id="btnPrevPage" class="btn-page" disabled>Anterior</button>
                    <span class="texto-suave texto-chico" id="pageInfo"></span>
                    <button id="btnNextPage" class="btn-page">Siguiente</button>
                </div>
            </div>

            <!-- Tabla -->
            <div class="table-container">
                <table id="historialTable">
                    <thead>
                        <tr>
                            <th>Fecha y Hora</th>
                            <th>Usuario</th>
                            <th>Acción</th>
                            <th>Servicio</th>
                            <th>Entidad / Producto</th>
                            <th>Cantidad</th>
                            <th>Detalle</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/tableUtils.js"></script>
    <script>

        let allHistory = [];
        let currentPage = 0;
        const PAGE_SIZE = 20;

        const historyBody    = document.getElementById('historyBody');
        const searchInput    = document.getElementById('searchInput');
        const filterAccion   = document.getElementById('filterAccion');
        const filterServicio = document.getElementById('filterServicio');
        const filterDesde    = document.getElementById('filterDesde');
        const filterHasta    = document.getElementById('filterHasta');
        const filterUsuario  = document.getElementById('filterUsuario');

        function getFiltered() {
            const term     = searchInput.value.toLowerCase();
            const accion   = filterAccion.value.toUpperCase();
            const servicio = filterServicio.value.toUpperCase();
            const usuario  = filterUsuario.value.toLowerCase();

            return allHistory.filter(h => {
                const accionVal   = (h.accion ?? h.tipo ?? '').toUpperCase();
                const detalleVal  = (h.detalles ?? '').toUpperCase();
                const servicioVal = (h.servicioOrigen ?? '').toUpperCase();
                const usuarioVal  = (h.usuarioEmail ?? '').toLowerCase();
                const entidad     = (h.nombreProducto ?? h.detalles ?? `#${h.entidadId ?? h.productoId ?? ''}` ?? '').toLowerCase();

                const matchTerm     = !term     || usuarioVal.includes(term) || entidad.includes(term) || accionVal.toLowerCase().includes(term) || detalleVal.toLowerCase().includes(term);
                const matchAccion   = !accion   || accionVal.includes(accion) || detalleVal.includes(accion);
                const matchServicio = !servicio || servicioVal === servicio;
                const matchUsuario  = !usuario  || usuarioVal.includes(usuario);

                return matchTerm && matchAccion && matchServicio && matchUsuario;
            });
        }

        function renderPage() {
            const filtered = getFiltered();
            const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
            if (currentPage >= totalPages) currentPage = totalPages - 1;
            const pageData = filtered.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);

            document.getElementById('resultCount').textContent =
                `Mostrando ${pageData.length} de ${filtered.length} registros (total: ${allHistory.length})`;
            document.getElementById('pageInfo').textContent = `Pág. ${currentPage + 1} / ${totalPages}`;
            document.getElementById('btnPrevPage').disabled = currentPage === 0;
            document.getElementById('btnNextPage').disabled = currentPage >= totalPages - 1;

            historyBody.innerHTML = '';
            if (pageData.length === 0) {
                historyBody.innerHTML = '<tr><td class="mensaje" colspan="7">No hay registros con los filtros aplicados.</td></tr>';
                return;
            }

            pageData.forEach(h => {
                const accion     = (h.accion ?? h.tipo ?? '').toUpperCase();
                const servicioOr = (h.servicioOrigen ?? '').toUpperCase();
                const fecha      = h.fecha ? new Date(h.fecha).toLocaleString('es-ES') : '-';
                const usuario    = h.usuarioEmail ?? '-';
                const entidad    = h.nombreProducto ?? (h.productoId ? `Producto #${h.productoId}` : (h.proveedorId ? `Proveedor #${h.proveedorId}` : `#${h.entidadId ?? '-'}`));
                const detalle    = h.detalles ?? '-';

                let qty = h.cantidad;
                if (qty != null && (accion.includes('SALIDA') || accion.includes('OUT') || detalle.toUpperCase().includes('SALIDA'))) {
                    if (qty > 0) qty = -qty;
                }

                const cantidad   = qty != null ? (qty > 0 ? `+${qty}` : `${qty}`) : '-';
                const claseCant  = qty > 0 ? 'texto-ok' : qty < 0 ? 'texto-error' : 'texto-suave';

                let badgeClass = 'badge-warning';
                if (accion.includes('ENTRADA') || accion.includes('IN'))  badgeClass = 'badge-stock';
                if (accion.includes('SALIDA')  || accion.includes('OUT')) badgeClass = 'badge-danger';
                if (accion.includes('CREAR')   || accion.includes('CREATE') || accion.includes('REGISTRO')) badgeClass = 'badge-info';

                const serviceBadges = { INVENTORY: 'badge-stock', CATALOG: 'badge-warning', SUPPLIERS: 'badge-info', USERS: 'badge-purple' };
                const serviceLabels = { INVENTORY: 'Inventario', CATALOG: 'Catálogo', SUPPLIERS: 'Proveedores', USERS: 'Usuarios' };
                const svcClass = serviceBadges[servicioOr] ?? 'badge-warning';
                const svcLabel = serviceLabels[servicioOr] ?? servicioOr;

                historyBody.innerHTML += `
                    <tr class="clickable-row" onclick="this.classList.toggle('expanded-detalle')">
                        <td class="texto-suave texto-chico nowrap">${esc(fecha)}</td>
                        <td class="texto-chico">${esc(usuario)}</td>
                        <td><span class="badge ${badgeClass}">${esc(accion)}</span></td>
                        <td>${svcLabel ? `<span class="badge ${svcClass}">${esc(svcLabel)}</span>` : '-'}</td>
                        <td class="negrita">${esc(entidad)}</td>
                        <td class="negrita ${claseCant}">${cantidad}</td>
                        <td class="detalle-cell">${esc(detalle)}</td>
                    </tr>
                `;
            });
        }

        async function loadHistory() {
            historyBody.innerHTML = '<tr><td class="mensaje" colspan="7">Cargando registros...</td></tr>';
            try {
                let url = '/auditoria?size=500&page=0';
                if (filterDesde.value) {
                    url += `&desde=${filterDesde.value}`;
                }
                if (filterHasta.value) {
                    url += `&hasta=${filterHasta.value}`;
                }
                const data = await api.get(url);
                allHistory = data.content ?? (Array.isArray(data) ? data : []);
                currentPage = 0;
                renderPage();
            } catch {
                historyBody.innerHTML = '<tr><td class="mensaje mensaje-error" colspan="7">Error al cargar el historial. ¿Está el MS-Audit activo?</td></tr>';
            }
        }

        function applyFilters() { currentPage = 0; renderPage(); }
        async function handleDateChange() { await loadHistory(); }

        searchInput.addEventListener('input', applyFilters);
        filterAccion.addEventListener('change', applyFilters);
        filterServicio.addEventListener('change', applyFilters);
        filterDesde.addEventListener('change', handleDateChange);
        filterHasta.addEventListener('change', handleDateChange);
        filterUsuario.addEventListener('input', applyFilters);

        document.getElementById('btnLimpiarFiltros').addEventListener('click', () => {
            searchInput.value = '';
            filterAccion.value = '';
            filterServicio.value = '';
            filterDesde.value = '';
            filterHasta.value = '';
            filterUsuario.value = '';
            loadHistory();
        });

        document.getElementById('btnRecargar').addEventListener('click', loadHistory);

        document.getElementById('btnPrevPage').addEventListener('click', () => { currentPage--; renderPage(); });
        document.getElementById('btnNextPage').addEventListener('click', () => { currentPage++; renderPage(); });

        loadHistory().then(() => {
            initTableUtils('historialTable', 'colToggleContainer');
            observeTableChanges('historialTable', 'colToggleContainer');
        });
    </script>
</body>
</html>
