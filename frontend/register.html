<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Sistema de Inventario</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="glass-card">
        <h1>Únete a <span class="brand">Inventary</span></h1>
        <p class="subtitle">Crea tu cuenta y empieza a gestionar hoy</p>

        <div id="alert" class="alert"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" placeholder="Juan Pérez" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="nombre@ejemplo.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>
            </div>

            <button type="submit">Registrarse</button>
        </form>

        <div class="footer-text">
            ¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alert = document.getElementById('alert');
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await api.post('/auth/register', { nombre, email, password });

                if (!response.error) {
                    alert.className = 'alert alert-success';
                    alert.textContent = '¡Registro con éxito! Revisa tu email para confirmar tu cuenta.';
                    alert.style.display = 'block';
                    document.getElementById('registerForm').reset();
                } else {
                    alert.className = 'alert alert-error';
                    alert.textContent = response.message;
                    alert.style.display = 'block';
                }
            } catch (err) {
                alert.className = 'alert alert-error';
                alert.textContent = 'Error al conectar con el servidor';
                alert.style.display = 'block';
            }
        });
    </script>
</body>
</html>
