<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | Sistema de Inventario</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="display: block;">

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h1 style="font-size: 1.5rem; margin-bottom: 2rem;">
                <span class="brand">Inventary</span>
            </h1>
            
            <nav>
                <a href="dashboard.html" class="nav-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="productos.html" class="nav-link active"><i data-lucide="package"></i> Productos</a>
                <a href="proveedores.html" class="nav-link"><i data-lucide="users"></i> Proveedores</a>
                <a href="inventario.html" class="nav-link"><i data-lucide="refresh-cw"></i> Inventario</a>
                <a href="historial.html" class="nav-link"><i data-lucide="history"></i> Historial</a>
            </nav>

            <div style="margin-top: auto;">
                <a href="index.html" class="nav-link" style="color: var(--error);"><i data-lucide="log-out"></i> Cerrar Sesión</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="margin-bottom: 3rem;">
                <h2>Gestión de Productos</h2>
                <p style="color: var(--text-secondary);">Administra el catálogo de productos de tu almacén.</p>
            </header>

            <!-- Acciones -->
            <div class="controls-row">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar por nombre o categoría...">
                </div>
                <button class="btn-add" id="openModalBtn">+ Nuevo Producto</button>
            </div>

            <!-- Tabla de Productos -->
            <div class="table-container">
                <table id="productsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="productsBody">
                        <!-- Se llenará con JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal para Nuevo Producto -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Añadir Producto</h3>
                <button class="close-modal" id="closeModalBtn">&times;</button>
            </div>
            <form id="productForm">
                <div class="form-group">
                    <label for="prodName">Nombre del Producto</label>
                    <input type="text" id="prodName" required placeholder="Ej. Laptop Pro">
                </div>
                <div class="form-group">
                    <label for="prodCat">Categoría</label>
                    <input type="text" id="prodCat" required placeholder="Ej. Electrónica">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="prodPrice">Precio (€)</label>
                        <input type="number" id="prodPrice" step="0.01" required placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="prodStock">Stock Inicial</label>
                        <input type="number" id="prodStock" required placeholder="0">
                    </div>
                </div>
                <button type="submit">Guardar Producto</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        let allProducts = [];

        const productsBody = document.getElementById('productsBody');
        const searchInput = document.getElementById('searchInput');
        const modal = document.getElementById('modalOverlay');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const productForm = document.getElementById('productForm');

        // Renderizar tabla
        function renderProducts(data) {
            productsBody.innerHTML = '';
            if (data.length === 0) {
                productsBody.innerHTML = '<tr><td colspan="7" style="text-align:center; color: var(--text-secondary); padding: 2rem;">No hay productos registrados.</td></tr>';
                return;
            }
            data.forEach(p => {
                const stock = p.stock ?? 0;
                const stockStatus = stock === 0 ? 'badge-danger' : (stock < 10 ? 'badge-warning' : 'badge-stock');
                const stockText = stock === 0 ? 'Sin Stock' : (stock < 10 ? 'Stock Bajo' : 'Disponible');
                const precio = (p.precioNeto ?? p.precio ?? 0).toFixed(2);

                productsBody.innerHTML += `
                    <tr>
                        <td>#${p.id}</td>
                        <td style="font-weight: 600;">${p.nombre}</td>
                        <td>${p.categoria ?? '-'}</td>
                        <td>${precio}€</td>
                        <td>${stock}</td>
                        <td><span class="badge ${stockStatus}">${stockText}</span></td>
                        <td>
                            <button onclick="deactivateProduct(${p.id})" style="width: auto; padding: 0.4rem 0.8rem; background: none; color: var(--error); border: 1px solid var(--error);">Desactivar</button>
                        </td>
                    </tr>
                `;
            });
        }

        // Cargar productos desde la API
        async function loadProducts() {
            productsBody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 2rem;">Cargando...</td></tr>';
            try {
                const data = await api.get('/productos');
                allProducts = Array.isArray(data) ? data : (data.content ?? []);
                renderProducts(allProducts);
            } catch (err) {
                productsBody.innerHTML = '<tr><td colspan="7" style="text-align:center; color: var(--error);">Error al cargar productos. ¿Está el servidor encendido?</td></tr>';
            }
        }

        // Borrado lógico (PUT activo=false)
        async function deactivateProduct(id) {
            if (!confirm('¿Seguro que quieres desactivar este producto?')) return;
            try {
                await api.delete(`/productos/${id}`);
                await loadProducts();
            } catch (err) {
                alert('Error al desactivar el producto.');
            }
        }

        // Buscador (filtra localmente)
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p =>
                p.nombre.toLowerCase().includes(term) ||
                (p.categoria ?? '').toLowerCase().includes(term)
            );
            renderProducts(filtered);
        });

        // Modal
        openModalBtn.onclick = () => modal.style.display = 'flex';
        closeModalBtn.onclick = () => modal.style.display = 'none';
        window.onclick = (event) => { if (event.target == modal) modal.style.display = 'none'; }

        // Crear producto
        productForm.onsubmit = async (e) => {
            e.preventDefault();
            const newProd = {
                nombre: document.getElementById('prodName').value,
                categoria: document.getElementById('prodCat').value,
                precioNeto: parseFloat(document.getElementById('prodPrice').value),
                sku: `SKU-${Date.now()}`
            };
            try {
                await api.post('/productos', newProd);
                await loadProducts();
                modal.style.display = 'none';
                productForm.reset();
            } catch (err) {
                alert('Error al crear el producto.');
            }
        };

        // Inicializar
        loadProducts();
        lucide.createIcons();
    </script>
</body>
</html>
