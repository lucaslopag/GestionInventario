<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | Sistema de Inventario</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div id="sidebarUserProfile" class="sidebar-profile-wrapper"></div>
            <nav class="mt-1">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="productos.html" class="nav-link active">Productos</a>
                <a href="proveedores.html" class="nav-link">Proveedores</a>
                <a href="inventario.html" class="nav-link">Inventario</a>
                <a href="historial.html" class="nav-link">Historial</a>
                <a href="usuarios.html" class="nav-link oculto" id="navUsuarios">Usuarios</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="mb-2">
                <h2>Gestión de Productos</h2>
                <p class="texto-suave">Administra el catálogo de productos de tu almacén.</p>
            </header>

            <!-- Filtros -->
            <div class="filters-bar fila">
                <div class="search-box flex-1">
                    <input type="text" id="searchInput" placeholder="Buscar por nombre o SKU...">
                </div>

                <select id="filterCategoria" class="filter-select">
                    <option value="">Todas las categorías</option>
                </select>

                <select id="filterActivo" class="filter-select">
                    <option value="activos">Solo Activos</option>
                    <option value="inactivos">Solo Inactivos</option>
                    <option value="todos">Todos</option>
                </select>

                <!-- Filtro Precio en un rectángulo -->
                <div class="fila">
                    <input class="ancho-100" type="number" id="filterPrecioVal" placeholder="Precio..." step="0.01">
                    <div class="separador"></div>
                    <select id="filterPrecioOp">
                        <option value=">=">Más de</option>
                        <option value="<=">Menos de</option>
                        <option value="=">Igual a (=)</option>
                    </select>
                </div>

                <!-- Contenedor para el toggle de columnas -->
                <div class="ml-1" id="colToggleContainer"></div>

                <button class="btn-add nowrap ml-auto" id="openModalBtn">Nuevo
                    Producto</button>
            </div>

            <!-- Búsqueda en Servidor (API Backend) -->
            <div class="filters-bar barra-info mb-1">
                <span class="fila negrita">Búsqueda en BD:</span>

                <div class="fila">
                    <input class="ancho-220" type="text" id="apiSearchNombre" placeholder="Buscar por Nombre...">
                    <button id="btnApiNombre" class="btn-secondary">Buscar</button>
                </div>

                <div class="fila">
                    <input class="ancho-180" type="text" id="apiSearchSku" placeholder="Buscar SKU exacto...">
                    <button id="btnApiSku" class="btn-secondary">Buscar SKU</button>
                </div>

                <button id="btnResetApi" class="btn-secondary ml-auto"
                    title="Limpiar Búsqueda en BD y Recargar">Limpiar</button>
            </div>

            <p class="texto-suave texto-chico mb-1" id="resultCount"></p>

            <!-- Tabla -->
            <div class="table-container">
                <table id="productsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>SKU</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Estado</th>
                            <th id="accionesHeader">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="productsBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Nuevo/Editar Producto -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Añadir Producto</h3>
                <button class="close-modal" id="closeModalBtn">Cerrar</button>
            </div>
            <div id="modalMsg" class="alert mb-1"></div>
            <form id="productForm">
                <input type="hidden" id="prodId">
                <div class="form-group">
                    <label>Nombre del Producto *</label>
                    <input type="text" id="prodName" required placeholder="Ej. Laptop Pro">
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Categoría *</label>
                        <input type="text" id="prodCat" required placeholder="Ej. Electrónica" list="catSuggestions">
                        <datalist id="catSuggestions"></datalist>
                    </div>
                    <div class="form-group">
                        <label>SKU</label>
                        <input type="text" id="prodSku" placeholder="Se genera automáticamente">
                    </div>
                </div>
                <div class="form-group">
                    <label>Precio (€) *</label>
                    <input type="number" id="prodPrice" step="0.01" required placeholder="0.00" min="0">
                </div>
                <button type="submit" id="submitBtn">Guardar Producto</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/tableUtils.js"></script>
    <script>

        let allProducts = []; // productos activos
        let allInactivos = []; // productos inactivos
        let stockMap = {};
        let isAdmin = false;

        // Detectar rol del usuario para mostrar/ocultar acciones
        const userRaw = localStorage.getItem('user');
        if (userRaw) {
            try {
                const u = JSON.parse(userRaw);
                isAdmin = (u.rol || '').toUpperCase() === 'ADMIN';
            } catch (e) { }
        }

        const productsBody = document.getElementById('productsBody');
        const searchInput = document.getElementById('searchInput');
        const filterCategoria = document.getElementById('filterCategoria');
        const filterActivo = document.getElementById('filterActivo');
        const filterPrecioOp = document.getElementById('filterPrecioOp');
        const filterPrecioVal = document.getElementById('filterPrecioVal');
        const modal = document.getElementById('modalOverlay');
        const modalMsg = document.getElementById('modalMsg');
        const productForm = document.getElementById('productForm');

        // Ocultar botón añadir y columna acciones si no es ADMIN
        if (!isAdmin) {
            document.getElementById('openModalBtn')?.remove();
            document.getElementById('accionesHeader')?.remove();
        }

        function getPool() {
            const estado = filterActivo.value;
            if (estado === 'inactivos') return allInactivos;
            if (estado === 'activos') return allProducts;
            return [...allProducts, ...allInactivos];
        }

        function getFilteredProducts() {
            const term = searchInput.value.toLowerCase();
            const cat = filterCategoria.value;
            const precioOp = filterPrecioOp.value;
            const precioVal = filterPrecioVal.value ? parseFloat(filterPrecioVal.value) : null;

            return getPool().filter(p => {
                const precio_v = p.precioNeto ?? p.precio ?? 0;
                const matchTerm = !term || p.nombre.toLowerCase().includes(term) || (p.sku || '').toLowerCase().includes(term);
                const matchCat = !cat || (p.categoria || '') === cat;

                let matchPrecio = true;
                if (precioVal !== null && !isNaN(precioVal)) {
                    if (precioOp === '>=') matchPrecio = precio_v >= precioVal;
                    if (precioOp === '<=') matchPrecio = precio_v <= precioVal;
                    if (precioOp === '=') matchPrecio = Math.abs(precio_v - precioVal) < 0.01;
                }

                return matchTerm && matchCat && matchPrecio;
            });
        }

        function renderProducts(data) {
            productsBody.innerHTML = '';
            const totalPool = getPool().length;
            document.getElementById('resultCount').textContent = `Mostrando ${data.length} de ${totalPool} productos`;

            if (data.length === 0) {
                productsBody.innerHTML = '<tr><td class="mensaje" colspan="8">No se encontraron productos con los filtros aplicados.</td></tr>';
                return;
            }
            data.forEach(p => {
                const stock = stockMap[p.id] ?? 0;
                const stockStatus = stock === 0 ? 'badge-danger' : (stock < 10 ? 'badge-warning' : 'badge-stock');
                const stockText = stock === 0 ? 'Sin Stock' : (stock < 10 ? 'Stock Bajo' : 'Disponible');
                const precio = (p.precioNeto ?? p.precio ?? 0).toFixed(2);
                const activo = p.activo !== false;
                const rowClass = !activo ? 'inactivo' : '';

                const accionesHtml = isAdmin ? `
                    <td><div class="fila">
                        <button onclick="editProduct(${p.id})" class="btn-icon btn-edit" title="Editar">Editar</button>
                        <button onclick="toggleActivoProduct(${p.id}, ${activo})" class="btn-icon ${activo ? 'btn-danger' : 'btn-edit'}" title="${activo ? 'Desactivar (Borrado Lógico)' : 'Reactivar'}">
                            ${activo ? 'Archivar' : 'Reactivar'}
                        </button>
                        ${!activo ? `<button onclick="deleteFisico(${p.id})" class="btn-icon btn-borrar" title="Borrar Físicamente de la BD">Eliminar</button>` : ''}</div></td>` : '';

                productsBody.innerHTML += `
                    <tr class="${rowClass}">
                        <td>#${p.id}</td>
                        <td class="negrita">${esc(p.nombre)}</td>
                        <td>${esc(p.categoria ?? '-')}</td>
                        <td class="mono texto-suave texto-chico">${esc(p.sku ?? '-')}</td>
                        <td>${precio} €</td>
                        <td class="negrita">${stock}</td>
                        <td><span class="badge ${stockStatus}">${stockText}</span></td>
                        ${accionesHtml}
                    </tr>
                `;
            });
            console.log('--- DEBUG renderProducts ---');
            console.log('Data length:', data.length);
            console.log('Admin Status:', isAdmin);
            console.log('HTML length inside productsBody:', productsBody.innerHTML.length);
        }

        function applyFilters() { renderProducts(getFilteredProducts()); }

        async function loadProducts() {
            productsBody.innerHTML = '<tr><td class="mensaje" colspan="8">Cargando productos...</td></tr>';
            try {
                const [prodActivos, prodInactivos, stockData] = await Promise.allSettled([
                    api.get('/productos'),
                    api.get('/productos/inactivos'),
                    api.get('/inventario/stock')
                ]);

                allProducts = (prodActivos.status === 'fulfilled' && !prodActivos.value.error)
                    ? (Array.isArray(prodActivos.value) ? prodActivos.value : (prodActivos.value.content ?? []))
                    : [];

                allInactivos = (prodInactivos.status === 'fulfilled' && !prodInactivos.value.error)
                    ? (Array.isArray(prodInactivos.value) ? prodInactivos.value : (prodInactivos.value.content ?? []))
                    : [];

                if (stockData.status === 'fulfilled' && !stockData.value.error) {
                    const stocks = Array.isArray(stockData.value) ? stockData.value : (stockData.value.content ?? []);
                    stockMap = {};
                    stocks.forEach(s => { stockMap[s.productoId ?? s.id] = s.cantidadDisponible ?? s.cantidad ?? 0; });
                }

                // Poblar selector de categorías (de ambos pools)
                const todosProductos = [...allProducts, ...allInactivos];
                const cats = [...new Set(todosProductos.map(p => p.categoria).filter(Boolean))].sort();
                filterCategoria.innerHTML = '<option value="">Todas las categorías</option>';
                cats.forEach(c => { filterCategoria.innerHTML += `<option value="${esc(c)}">${esc(c)}</option>`; });

                const datalist = document.getElementById('catSuggestions');
                datalist.innerHTML = '';
                cats.forEach(c => { datalist.innerHTML += `<option value="${esc(c)}">`; });

                renderProducts(getFilteredProducts());
            } catch (err) {
                productsBody.innerHTML = '<tr><td class="mensaje mensaje-error" colspan="8">Error al cargar productos.</td></tr>';
            }
        }

        // Borrado LÓGICO: toggle activo/inactivo según FDD (activo=false NO borra de BD)
        async function toggleActivoProduct(id, activo) {
            const accion = activo ? 'desactivar' : 'reactivar';
            if (!confirm(`¿Seguro que quieres ${accion} este producto? Se moverá a la lista de inactivos.`)) return;
            const res = await api.delete(`/productos/${id}`);
            if (res && res.error) { alert(res.message); return; }
            await loadProducts();
        }

        // Borrado FÍSICO (Solo para productos inactivos)
        async function deleteFisico(id) {
            if (!confirm(`ATENCIÓN: ¿Estás totalmente seguro de borrar FÍSICAMENTE este producto de la base de datos? Se perderá todo su historial asociado.`)) return;
            const res = await api.delete(`/productos/${id}/fisico`);
            if (res && res.error) { alert(res.message); return; }
            await loadProducts();
        }

        function editProduct(id) {
            const allPool = [...allProducts, ...allInactivos];
            const p = allPool.find(x => x.id === id);
            if (!p) return;
            document.getElementById('modalTitle').textContent = 'Editar Producto';
            document.getElementById('prodId').value = p.id;
            document.getElementById('prodName').value = p.nombre;
            document.getElementById('prodCat').value = p.categoria ?? '';
            document.getElementById('prodSku').value = p.sku ?? '';
            document.getElementById('prodPrice').value = p.precioNeto ?? p.precio ?? '';
            document.getElementById('submitBtn').textContent = 'Actualizar Producto';
            modalMsg.style.display = 'none';
            modal.style.display = 'flex';
        }

        const openModalBtn = document.getElementById('openModalBtn');
        if (openModalBtn) {
            openModalBtn.onclick = () => {
                document.getElementById('modalTitle').textContent = 'Añadir Producto';
                document.getElementById('prodId').value = '';
                document.getElementById('submitBtn').textContent = 'Guardar Producto';
                productForm.reset();
                modalMsg.style.display = 'none';
                modal.style.display = 'flex';
            };
        }
        document.getElementById('closeModalBtn').onclick = () => modal.style.display = 'none';
        window.addEventListener('click', e => { if (e.target === modal) modal.style.display = 'none'; });

        productForm.onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('prodId').value;
            const body = {
                nombre: document.getElementById('prodName').value.trim(),
                categoria: document.getElementById('prodCat').value.trim(),
                precioNeto: parseFloat(document.getElementById('prodPrice').value),
                sku: document.getElementById('prodSku').value.trim() || undefined
            };
            const res = id ? await api.put(`/productos/${id}`, body) : await api.post('/productos', body);
            if (res && res.error) {
                modalMsg.textContent = res.message || 'Error al guardar el producto.';
                modalMsg.className = 'alert alert-error';
                modalMsg.style.display = 'block';
                return;
            }
            modal.style.display = 'none';
            productForm.reset();
            await loadProducts();
        };

        searchInput.addEventListener('input', applyFilters);
        filterCategoria.addEventListener('change', applyFilters);
        filterActivo.addEventListener('change', applyFilters);
        filterPrecioOp.addEventListener('change', applyFilters);
        filterPrecioVal.addEventListener('input', applyFilters);

        // Lógica de Búsqueda en Servidor
        document.getElementById('btnApiNombre').addEventListener('click', async () => {
            const term = document.getElementById('apiSearchNombre').value.trim();
            if (!term) return;
            document.getElementById('productsBody').innerHTML = '<tr><td class="centro" colspan="8">Buscando en servidor...</td></tr>';
            try {
                const resActivos = await api.get(`/productos/buscar?nombre=${term}`);
                const resInactivos = await api.get(`/productos/inactivos/buscar?nombre=${term}`);

                allProducts = (!resActivos.error) ? (Array.isArray(resActivos) ? resActivos : (resActivos.content ?? [])) : [];
                allInactivos = (!resInactivos.error) ? (Array.isArray(resInactivos) ? resInactivos : (resInactivos.content ?? [])) : [];

                // Reset local filters to show API results clearly
                searchInput.value = '';
                filterCategoria.value = '';
                applyFilters();
            } catch (err) {
                console.error(err);
            }
        });

        document.getElementById('btnApiSku').addEventListener('click', async () => {
            const sku = document.getElementById('apiSearchSku').value.trim();
            if (!sku) return;
            document.getElementById('productsBody').innerHTML = '<tr><td class="centro" colspan="8">Buscando en servidor...</td></tr>';
            try {
                const res = await api.get(`/productos/sku/${sku}`);
                allProducts = [];
                allInactivos = [];
                if (!res.error && res.id) {
                    if (res.activo) allProducts.push(res);
                    else allInactivos.push(res);
                } else {
                    document.getElementById('productsBody').innerHTML = '<tr><td class="centro texto-error" colspan="8">SKU no encontrado en BD.</td></tr>';
                    document.getElementById('resultCount').textContent = 'Resultados: 0';
                    return;
                }
                searchInput.value = '';
                filterCategoria.value = '';
                applyFilters();
            } catch (err) {
                console.error(err);
            }
        });

        document.getElementById('btnResetApi').addEventListener('click', () => {
            document.getElementById('apiSearchNombre').value = '';
            document.getElementById('apiSearchSku').value = '';
            loadProducts();
        });

        loadProducts().then(() => {
            initTableUtils('productsTable', 'colToggleContainer');
            observeTableChanges('productsTable', 'colToggleContainer');
        });
    </script>
</body>

</html>
