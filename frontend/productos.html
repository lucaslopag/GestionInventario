<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | Sistema de Inventario</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="display: block;">

    <div class="dashboard-container">
        <aside class="sidebar">
            <div id="sidebarUserProfile" class="sidebar-profile-wrapper"></div>
            <nav style="margin-top: 1.5rem;">
                <a href="dashboard.html" class="nav-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="productos.html" class="nav-link active"><i data-lucide="package"></i> Productos</a>
                <a href="proveedores.html" class="nav-link"><i data-lucide="truck"></i> Proveedores</a>
                <a href="inventario.html" class="nav-link"><i data-lucide="refresh-cw"></i> Inventario</a>
                <a href="historial.html" class="nav-link"><i data-lucide="history"></i> Historial</a>
                <a href="usuarios.html" class="nav-link" id="navUsuarios" style="display:none;"><i data-lucide="users"></i> Usuarios</a>
            </nav>
        </aside>

        <main class="main-content">
            <header style="margin-bottom: 2rem;">
                <h2>Gestión de Productos</h2>
                <p style="color: var(--text-secondary);">Administra el catálogo de productos de tu almacén.</p>
            </header>

            <!-- Filtros -->
            <div class="filters-bar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar por nombre o SKU...">
                </div>
                <select id="filterCategoria" class="filter-select">
                    <option value="">Todas las categorías</option>
                </select>
                <select id="filterEstado" class="filter-select">
                    <option value="">Todos los estados</option>
                    <option value="disponible">Disponible</option>
                    <option value="bajo">Stock Bajo</option>
                    <option value="agotado">Sin Stock</option>
                </select>
                <select id="filterPrecio" class="filter-select">
                    <option value="">Cualquier precio</option>
                    <option value="0-50">0 — 50 €</option>
                    <option value="50-200">50 — 200 €</option>
                    <option value="200-1000">200 — 1.000 €</option>
                    <option value="1000+">Más de 1.000 €</option>
                </select>
                <button class="btn-add" id="openModalBtn" style="white-space:nowrap;">+ Nuevo Producto</button>
            </div>

            <div id="activeFiltersBar" style="display:none; margin-bottom:1rem; display:flex; gap:0.5rem; flex-wrap:wrap;"></div>

            <!-- Contador de resultados -->
            <p id="resultCount" style="color: var(--text-secondary); font-size:0.9rem; margin-bottom: 1rem;"></p>

            <!-- Tabla -->
            <div class="table-container">
                <table id="productsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>SKU</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="productsBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Nuevo/Editar Producto -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Añadir Producto</h3>
                <button class="close-modal" id="closeModalBtn">&times;</button>
            </div>
            <div id="modalMsg" class="alert" style="margin-bottom:1rem;"></div>
            <form id="productForm">
                <input type="hidden" id="prodId">
                <div class="form-group">
                    <label>Nombre del Producto</label>
                    <input type="text" id="prodName" required placeholder="Ej. Laptop Pro">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Categoría</label>
                        <input type="text" id="prodCat" required placeholder="Ej. Electrónica" list="catSuggestions">
                        <datalist id="catSuggestions"></datalist>
                    </div>
                    <div class="form-group">
                        <label>SKU</label>
                        <input type="text" id="prodSku" placeholder="Se genera automáticamente">
                    </div>
                </div>
                <div class="form-group">
                    <label>Precio (€)</label>
                    <input type="number" id="prodPrice" step="0.01" required placeholder="0.00">
                </div>
                <button type="submit" id="submitBtn">Guardar Producto</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
        lucide.createIcons();

        let allProducts = [];
        let stockMap = {};

        const productsBody = document.getElementById('productsBody');
        const searchInput = document.getElementById('searchInput');
        const filterCategoria = document.getElementById('filterCategoria');
        const filterEstado = document.getElementById('filterEstado');
        const filterPrecio = document.getElementById('filterPrecio');
        const modal = document.getElementById('modalOverlay');
        const modalMsg = document.getElementById('modalMsg');
        const productForm = document.getElementById('productForm');

        function getFilteredProducts() {
            const term = searchInput.value.toLowerCase();
            const cat = filterCategoria.value;
            const estado = filterEstado.value;
            const precio = filterPrecio.value;

            return allProducts.filter(p => {
                const stock = stockMap[p.id] ?? p.stock ?? 0;
                const precio_v = p.precioNeto ?? p.precio ?? 0;

                const matchTerm = !term || p.nombre.toLowerCase().includes(term) || (p.sku || '').toLowerCase().includes(term);
                const matchCat = !cat || (p.categoria || '') === cat;

                let matchEstado = true;
                if (estado === 'disponible') matchEstado = stock >= 10;
                else if (estado === 'bajo') matchEstado = stock > 0 && stock < 10;
                else if (estado === 'agotado') matchEstado = stock === 0;

                let matchPrecio = true;
                if (precio === '0-50') matchPrecio = precio_v <= 50;
                else if (precio === '50-200') matchPrecio = precio_v > 50 && precio_v <= 200;
                else if (precio === '200-1000') matchPrecio = precio_v > 200 && precio_v <= 1000;
                else if (precio === '1000+') matchPrecio = precio_v > 1000;

                return matchTerm && matchCat && matchEstado && matchPrecio;
            });
        }

        function renderProducts(data) {
            productsBody.innerHTML = '';
            document.getElementById('resultCount').textContent = `Mostrando ${data.length} de ${allProducts.length} productos`;

            if (data.length === 0) {
                productsBody.innerHTML = '<tr><td colspan="8" style="text-align:center; color: var(--text-secondary); padding: 2rem;">No se encontraron productos con los filtros aplicados.</td></tr>';
                return;
            }
            data.forEach(p => {
                const stock = stockMap[p.id] ?? p.stock ?? 0;
                const stockStatus = stock === 0 ? 'badge-danger' : (stock < 10 ? 'badge-warning' : 'badge-stock');
                const stockText = stock === 0 ? 'Sin Stock' : (stock < 10 ? 'Stock Bajo' : 'Disponible');
                const precio = (p.precioNeto ?? p.precio ?? 0).toFixed(2);
                const activo = p.activo !== false;

                productsBody.innerHTML += `
                    <tr style="${!activo ? 'opacity:0.5;' : ''}">
                        <td>#${p.id}</td>
                        <td style="font-weight: 600;">${p.nombre}</td>
                        <td>${p.categoria ?? '—'}</td>
                        <td style="font-family: monospace; font-size:0.85rem; color: var(--text-secondary);">${p.sku ?? '—'}</td>
                        <td>${precio} €</td>
                        <td style="font-weight:700;">${stock}</td>
                        <td><span class="badge ${stockStatus}">${stockText}</span></td>
                        <td style="display:flex; gap:0.5rem;">
                            <button onclick="editProduct(${p.id})" class="btn-icon btn-edit" title="Editar"><i data-lucide="pencil"></i></button>
                            <button onclick="deactivateProduct(${p.id})" class="btn-icon btn-danger" title="${activo ? 'Desactivar' : 'Activar'}">
                                <i data-lucide="${activo ? 'trash-2' : 'refresh-cw'}"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            lucide.createIcons();
        }

        function applyFilters() {
            renderProducts(getFilteredProducts());
        }

        async function loadProducts() {
            productsBody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding: 2rem; color: var(--text-secondary);">Cargando productos...</td></tr>';
            try {
                const [prodData, stockData] = await Promise.allSettled([
                    api.get('/productos'),
                    api.get('/inventario/stock')
                ]);

                if (prodData.status === 'fulfilled' && !prodData.value.error) {
                    allProducts = Array.isArray(prodData.value) ? prodData.value : (prodData.value.content ?? []);
                } else {
                    allProducts = [];
                }

                if (stockData.status === 'fulfilled' && !stockData.value.error) {
                    const stocks = Array.isArray(stockData.value) ? stockData.value : (stockData.value.content ?? []);
                    stockMap = {};
                    stocks.forEach(s => { stockMap[s.productoId ?? s.id] = s.cantidadDisponible ?? s.cantidad ?? 0; });
                }

                // Poblar selector de categorías
                const cats = [...new Set(allProducts.map(p => p.categoria).filter(Boolean))].sort();
                filterCategoria.innerHTML = '<option value="">Todas las categorías</option>';
                cats.forEach(c => { filterCategoria.innerHTML += `<option value="${c}">${c}</option>`; });

                // Sugerencias de categorías en el formulario
                const datalist = document.getElementById('catSuggestions');
                cats.forEach(c => { datalist.innerHTML += `<option value="${c}">`; });

                renderProducts(allProducts);
            } catch (err) {
                productsBody.innerHTML = '<tr><td colspan="8" style="text-align:center; color: var(--error); padding:2rem;">Error al cargar productos.</td></tr>';
            }
        }

        async function deactivateProduct(id) {
            if (!confirm('¿Seguro que quieres cambiar el estado de este producto?')) return;
            const res = await api.delete(`/productos/${id}`);
            if (res && res.error) { alert(res.message); return; }
            await loadProducts();
        }

        function editProduct(id) {
            const p = allProducts.find(x => x.id === id);
            if (!p) return;
            document.getElementById('modalTitle').textContent = 'Editar Producto';
            document.getElementById('prodId').value = p.id;
            document.getElementById('prodName').value = p.nombre;
            document.getElementById('prodCat').value = p.categoria ?? '';
            document.getElementById('prodSku').value = p.sku ?? '';
            document.getElementById('prodPrice').value = p.precioNeto ?? p.precio ?? '';
            document.getElementById('submitBtn').textContent = 'Actualizar Producto';
            modalMsg.style.display = 'none';
            modal.style.display = 'flex';
        }

        document.getElementById('openModalBtn').onclick = () => {
            document.getElementById('modalTitle').textContent = 'Añadir Producto';
            document.getElementById('prodId').value = '';
            document.getElementById('submitBtn').textContent = 'Guardar Producto';
            productForm.reset();
            modalMsg.style.display = 'none';
            modal.style.display = 'flex';
        };
        document.getElementById('closeModalBtn').onclick = () => modal.style.display = 'none';
        window.addEventListener('click', e => { if (e.target === modal) modal.style.display = 'none'; });

        productForm.onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('prodId').value;
            const body = {
                nombre: document.getElementById('prodName').value,
                categoria: document.getElementById('prodCat').value,
                precioNeto: parseFloat(document.getElementById('prodPrice').value),
                sku: document.getElementById('prodSku').value || `SKU-${Date.now()}`
            };
            const res = id ? await api.put(`/productos/${id}`, body) : await api.post('/productos', body);
            if (res && res.error) {
                modalMsg.textContent = res.message;
                modalMsg.className = 'alert alert-error';
                modalMsg.style.display = 'block';
                return;
            }
            modal.style.display = 'none';
            productForm.reset();
            await loadProducts();
        };

        searchInput.addEventListener('input', applyFilters);
        filterCategoria.addEventListener('change', applyFilters);
        filterEstado.addEventListener('change', applyFilters);
        filterPrecio.addEventListener('change', applyFilters);

        loadProducts();
    </script>
</body>
</html>
