<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Sistema de Inventario</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Lucide se carga primero para que los iconos estén disponibles de inmediato -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="display: block;">

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- Perfil de usuario (arriba a la izquierda) -->
            <div id="sidebarUserProfile" class="sidebar-profile-wrapper"></div>

            <nav style="margin-top: 1.5rem;">
                <a href="dashboard.html" class="nav-link active"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="productos.html" class="nav-link"><i data-lucide="package"></i> Productos</a>
                <a href="proveedores.html" class="nav-link"><i data-lucide="truck"></i> Proveedores</a>
                <a href="inventario.html" class="nav-link"><i data-lucide="refresh-cw"></i> Inventario</a>
                <a href="historial.html" class="nav-link"><i data-lucide="history"></i> Historial</a>
                <a href="usuarios.html" class="nav-link" id="navUsuarios" style="display:none;"><i data-lucide="users"></i> Usuarios</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
                <div>
                    <h2>Panel de Control</h2>
                    <p style="color: var(--text-secondary);">Bienvenido de nuevo, <span id="userName" style="color: white;">Usuario</span></p>
                </div>
                <div style="background: var(--card-bg); padding: 0.5rem 1rem; border-radius: 12px; border: 1px solid var(--border);">
                    <span id="userRole" style="font-size: 0.8rem; font-weight: 700; color: var(--accent);">USUARIO</span>
                </div>
            </header>

            <!-- Stats Overview -->
            <div class="stats-grid">
                <div class="stat-card">
                    <p class="stat-label">Total Productos</p>
                    <p class="stat-value" id="statProductos">—</p>
                </div>
                <div class="stat-card">
                    <p class="stat-label">Stock Bajo</p>
                    <p class="stat-value" id="statStockBajo" style="color: var(--error);">—</p>
                </div>
                <div class="stat-card">
                    <p class="stat-label">Proveedores</p>
                    <p class="stat-value" id="statProveedores">—</p>
                </div>
            </div>

            <!-- Charts Section -->
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; margin-top: 3rem;">
                <div style="background: var(--card-bg); padding: 2rem; border-radius: 24px; border: 1px solid var(--border);">
                    <h3 style="margin-bottom: 1.5rem;">Actividad Semanal</h3>
                    <canvas id="activityChart" height="120"></canvas>
                </div>
                <div style="background: var(--card-bg); padding: 2rem; border-radius: 24px; border: 1px solid var(--border);">
                    <h3 style="margin-bottom: 1.5rem;">Stock por Categoría</h3>
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>

            <!-- Actividad Reciente -->
            <div id="recentActivity" style="margin-top: 3rem; background: var(--card-bg); padding: 2rem; border-radius: 24px; border: 1px solid var(--border);">
                <h3>Actividad Reciente</h3>
                <p style="color: var(--text-secondary); margin-top: 1rem;">Cargando actividad reciente...</p>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
        // Inicializar iconos INMEDIATAMENTE — antes de cualquier llamada async
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });

        document.addEventListener('DOMContentLoaded', async () => {
            const user = JSON.parse(localStorage.getItem('user')) || { nombre: 'Usuario', rol: 'USUARIO' };
            document.getElementById('userName').textContent = user.nombre;
            document.getElementById('userRole').textContent = (user.rol || 'USUARIO').toUpperCase();

            // Gráficos inicializados con datos vacíos para que la UI no salte
            const ctxActivity = document.getElementById('activityChart').getContext('2d');
            const ctxCategory = document.getElementById('categoryChart').getContext('2d');

            const days = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            const labels7 = [];
            const today = new Date();
            for (let i = 6; i >= 0; i--) {
                const d = new Date(); d.setDate(today.getDate() - i);
                labels7.push(days[d.getDay()]);
            }

            const activityChart = new Chart(ctxActivity, {
                type: 'line',
                data: {
                    labels: labels7,
                    datasets: [{ label: 'Movimientos', data: [0,0,0,0,0,0,0], borderColor: '#00d2ff', backgroundColor: 'rgba(0,210,255,0.1)', fill: true, tension: 0.4, borderWidth: 3, pointBackgroundColor: '#00d2ff', pointRadius: 5 }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8', stepSize: 1 } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    }
                }
            });

            const categoryChart = new Chart(ctxCategory, {
                type: 'bar',
                data: {
                    labels: ['Sin datos'],
                    datasets: [{ label: 'Productos', data: [0], backgroundColor: '#3a7bd5', borderRadius: 8, hoverBackgroundColor: '#00d2ff' }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    }
                }
            });

            // Cargar todo EN PARALELO para máxima velocidad
            const [productosRes, stockRes, proveedoresRes, auditRes] = await Promise.allSettled([
                api.get('/productos'),
                api.get('/inventario/stock'),
                api.get('/proveedores'),
                api.get('/auditoria?size=100')
            ]);

            // Stats: Productos
            if (productosRes.status === 'fulfilled' && !productosRes.value.error) {
                const productos = Array.isArray(productosRes.value) ? productosRes.value : (productosRes.value.content ?? []);
                document.getElementById('statProductos').textContent = productos.length;

                // Gráfico de categorías
                if (productos.length > 0) {
                    const categorias = {};
                    productos.forEach(p => { const c = p.categoria || 'Sin Cat.'; categorias[c] = (categorias[c] || 0) + 1; });
                    categoryChart.data.labels = Object.keys(categorias);
                    categoryChart.data.datasets[0].data = Object.values(categorias);
                    categoryChart.update();
                }
            } else {
                document.getElementById('statProductos').textContent = '—';
            }

            // Stats: Stock Bajo
            if (stockRes.status === 'fulfilled' && !stockRes.value.error) {
                const stock = Array.isArray(stockRes.value) ? stockRes.value : (stockRes.value.content ?? []);
                const bajo = stock.filter(s => (s.cantidadDisponible ?? s.cantidad ?? 0) < 10).length;
                document.getElementById('statStockBajo').textContent = bajo;
            } else {
                document.getElementById('statStockBajo').textContent = '—';
            }

            // Stats: Proveedores
            if (proveedoresRes.status === 'fulfilled' && !proveedoresRes.value.error) {
                const prov = Array.isArray(proveedoresRes.value) ? proveedoresRes.value : (proveedoresRes.value.content ?? []);
                document.getElementById('statProveedores').textContent = prov.length;
            } else {
                document.getElementById('statProveedores').textContent = '—';
            }

            // Actividad y gráfico de líneas
            if (auditRes.status === 'fulfilled' && !auditRes.value.error) {
                const logs = auditRes.value.content ?? (Array.isArray(auditRes.value) ? auditRes.value : []);

                // Actualizar gráfico de actividad con datos reales
                const actData = labels7.map((_, i) => {
                    const d = new Date(); d.setDate(today.getDate() - (6 - i));
                    return logs.filter(log => new Date(log.fecha).toDateString() === d.toDateString()).length;
                });
                activityChart.data.datasets[0].data = actData;
                activityChart.update();

                // Actividad reciente
                const recentEl = document.getElementById('recentActivity');
                if (logs.length > 0) {
                    let html = '<h3>Actividad Reciente</h3><div style="margin-top: 1rem;">';
                    logs.slice(0, 5).forEach(log => {
                        const date = new Date(log.fecha).toLocaleString('es-ES');
                        const accion = log.accion || log.tipo || '—';
                        const badgeClass = accion.includes('ENTRADA') ? 'badge-stock' : accion.includes('SALIDA') ? 'badge-danger' : 'badge-warning';
                        html += `
                            <div style="padding: 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 1rem;">
                                <div style="display:flex; align-items:center; gap:1rem;">
                                    <span class="badge ${badgeClass}">${accion}</span>
                                    <p style="font-size: 0.85rem; color: var(--text-secondary);">${log.detalles || log.usuarioEmail || 'Sin detalles'}</p>
                                </div>
                                <p style="font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap;">${date}</p>
                            </div>
                        `;
                    });
                    html += '</div>';
                    recentEl.innerHTML = html;
                } else {
                    document.getElementById('recentActivity').innerHTML = '<h3>Actividad Reciente</h3><p style="color: var(--text-secondary); margin-top: 1rem;">No hay actividad registrada aún.</p>';
                }
            }

            // Re-renderizar iconos tras sidebar.js
            lucide.createIcons();
        });
    </script>
</body>
</html>
