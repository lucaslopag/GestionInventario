<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Sistema de Inventario</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: block;"> <!-- Sobrescribimos el flex del body original -->

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h1 style="font-size: 1.5rem; margin-bottom: 2rem;">
                <span class="brand">Inventary</span>
            </h1>
            
            <nav>
                <a href="dashboard.html" class="nav-link active">🏠 Dashboard</a>
                <a href="productos.html" class="nav-link">📦 Productos</a>
                <a href="proveedores.html" class="nav-link">🤝 Proveedores</a>
                <a href="inventario.html" class="nav-link">🔄 Inventario</a>
                <a href="historial.html" class="nav-link">📜 Historial</a>
            </nav>

            <div style="margin-top: auto;">
                <a href="index.html" class="nav-link" style="color: var(--error);">🚪 Cerrar Sesión</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
                <div>
                    <h2>Panel de Control</h2>
                    <p style="color: var(--text-secondary);">Bienvenido de nuevo, <span id="userName" style="color: white;">Usuario</span></p>
                </div>
                <div style="background: var(--card-bg); padding: 0.5rem 1rem; border-radius: 12px; border: 1px solid var(--border);">
                    <span id="userRole" style="font-size: 0.8rem; font-weight: 700; color: var(--accent);">ADMIN</span>
                </div>
            </header>

            <!-- Stats Overview -->
            <div class="stats-grid">
                <div class="stat-card">
                    <p class="stat-label">Total Productos</p>
                    <p class="stat-value">124</p>
                </div>
                <div class="stat-card">
                    <p class="stat-label">Stock Bajo</p>
                    <p class="stat-value" style="color: var(--error);">8</p>
                </div>
                <div class="stat-card">
                    <p class="stat-label">Proveedores</p>
                    <p class="stat-value">12</p>
                </div>
            </div>

            <div style="margin-top: 4rem; background: var(--card-bg); padding: 2rem; border-radius: 24px; border: 1px solid var(--border);">
                <h3>Actividad Reciente</h3>
                <p style="color: var(--text-secondary); margin-top: 1rem;">Conecta con el MS-Audit para ver los últimos movimientos.</p>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Simulación de carga de datos de usuario
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user')) || { nombre: 'Alejandro', rol: 'ADMIN' };
            document.getElementById('userName').textContent = user.nombre;
            document.getElementById('userRole').textContent = user.rol;
        });
    </script>
</body>
</html>
