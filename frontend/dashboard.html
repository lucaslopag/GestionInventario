<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Sistema de Inventario</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- Perfil de usuario (arriba a la izquierda) -->
            <div id="sidebarUserProfile" class="sidebar-profile-wrapper"></div>

            <nav class="mt-1">
                <a href="dashboard.html" class="nav-link active">Dashboard</a>
                <a href="productos.html" class="nav-link">Productos</a>
                <a href="proveedores.html" class="nav-link">Proveedores</a>
                <a href="inventario.html" class="nav-link">Inventario</a>
                <a href="historial.html" class="nav-link">Historial</a>
                <a href="usuarios.html" class="nav-link oculto" id="navUsuarios">Usuarios</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="fila fila-entre mb-2">
                <div>
                    <h2>Panel de Control</h2>
                    <p class="texto-suave">Bienvenido de nuevo, <span id="userName">Usuario</span></p>
                </div>
                <div class="etiqueta">
                    <span class="texto-chico negrita" id="userRole">USUARIO</span>
                </div>
            </header>

            <!-- Stats Overview -->
            <div class="stats-grid">
                <div class="stat-card">
                    <p class="stat-label">Total Productos</p>
                    <p class="stat-value" id="statProductos">-</p>
                </div>
                <div class="stat-card">
                    <p class="stat-label">Stock Bajo</p>
                    <p class="stat-value texto-error" id="statStockBajo">-</p>
                </div>
                <div class="stat-card">
                    <p class="stat-label">Proveedores</p>
                    <p class="stat-value" id="statProveedores">-</p>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="grid-2-1 mt-2">
                <div class="caja">
                    <h3 class="mb-1">Actividad Semanal</h3>
                    <canvas id="activityChart" height="120"></canvas>
                </div>
                <div class="caja">
                    <h3 class="mb-1">Stock por Categoría</h3>
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>

            <!-- Actividad Reciente -->
            <div class="caja mt-2" id="recentActivity">
                <h3>Actividad Reciente</h3>
                <p class="texto-suave mt-1">Cargando actividad reciente...</p>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
        // Inicializar iconos INMEDIATAMENTE - antes de cualquier llamada async
        document.addEventListener('DOMContentLoaded', () => {
        });

        document.addEventListener('DOMContentLoaded', async () => {
            const user = JSON.parse(localStorage.getItem('user')) || { nombre: 'Usuario', rol: 'USUARIO' };
            const isAdmin = (user.rol || '').toUpperCase() === 'ADMIN';
            document.getElementById('userName').textContent = user.nombre;
            document.getElementById('userRole').textContent = (user.rol || 'USUARIO').toUpperCase();

            // Gráficos inicializados con datos vacíos para que la UI no salte
            const ctxActivity = document.getElementById('activityChart').getContext('2d');
            const ctxCategory = document.getElementById('categoryChart').getContext('2d');

            const days = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            const labels7 = [];
            const today = new Date();
            for (let i = 6; i >= 0; i--) {
                const d = new Date(); d.setDate(today.getDate() - i);
                labels7.push(days[d.getDay()]);
            }

            const activityChart = new Chart(ctxActivity, {
                type: 'line',
                data: {
                    labels: labels7,
                    datasets: [{ label: 'Movimientos', data: [0,0,0,0,0,0,0], borderColor: '#1f4e8c', backgroundColor: 'rgba(31,78,140,0.1)', fill: true, tension: 0, borderWidth: 2, pointBackgroundColor: '#1f4e8c', pointRadius: 3 }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#dddddd' }, ticks: { color: '#555555', stepSize: 1 } },
                        x: { grid: { display: false }, ticks: { color: '#555555' } }
                    }
                }
            });

            const categoryChart = new Chart(ctxCategory, {
                type: 'bar',
                data: {
                    labels: ['Sin datos'],
                    datasets: [{ label: 'Productos', data: [0], backgroundColor: '#1f4e8c' }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#dddddd' }, ticks: { color: '#555555' } },
                        x: { grid: { display: false }, ticks: { color: '#555555' } }
                    }
                }
            });

            // Cargar todo EN PARALELO para máxima velocidad
            const [productosRes, stockRes, proveedoresRes, auditRes] = await Promise.allSettled([
                api.get('/productos'),
                api.get('/inventario/stock'),
                api.get('/proveedores'),
                isAdmin ? api.get('/auditoria?size=100') : api.get('/inventario/movimientos')
            ]);

            // Stats: Productos
            if (productosRes.status === 'fulfilled' && !productosRes.value.error) {
                const productos = Array.isArray(productosRes.value) ? productosRes.value : (productosRes.value.content ?? []);
                document.getElementById('statProductos').textContent = productos.length;

                // Gráfico de categorías
                if (productos.length > 0) {
                    const categorias = {};
                    productos.forEach(p => { const c = p.categoria || 'Sin Cat.'; categorias[c] = (categorias[c] || 0) + 1; });
                    categoryChart.data.labels = Object.keys(categorias);
                    categoryChart.data.datasets[0].data = Object.values(categorias);
                    categoryChart.update();
                }
            } else {
                document.getElementById('statProductos').textContent = '-';
            }

            // Stats: Stock Bajo
            if (stockRes.status === 'fulfilled' && !stockRes.value.error) {
                const stock = Array.isArray(stockRes.value) ? stockRes.value : (stockRes.value.content ?? []);
                const bajo = stock.filter(s => (s.cantidadDisponible ?? s.cantidad ?? 0) < 10).length;
                document.getElementById('statStockBajo').textContent = bajo;
            } else {
                document.getElementById('statStockBajo').textContent = '-';
            }

            // Stats: Proveedores
            if (proveedoresRes.status === 'fulfilled' && !proveedoresRes.value.error) {
                const prov = Array.isArray(proveedoresRes.value) ? proveedoresRes.value : (proveedoresRes.value.content ?? []);
                document.getElementById('statProveedores').textContent = prov.length;
            } else {
                document.getElementById('statProveedores').textContent = '-';
            }

            // Actividad y gráfico de líneas
            if (auditRes.status === 'fulfilled' && !auditRes.value.error) {
                const logs = auditRes.value.content ?? (Array.isArray(auditRes.value) ? auditRes.value : []);

                // Actualizar gráfico de actividad con datos reales
                const actData = labels7.map((_, i) => {
                    const d = new Date(); d.setDate(today.getDate() - (6 - i));
                    return logs.filter(log => new Date(log.fecha).toDateString() === d.toDateString()).length;
                });
                activityChart.data.datasets[0].data = actData;
                activityChart.update();

                // Actividad reciente
                const recentEl = document.getElementById('recentActivity');
                if (logs.length > 0) {
                    let html = '<h3>Actividad Reciente</h3><div class="mt-1">';
                    logs.slice(0, 5).forEach(log => {
                        const date = new Date(log.fecha).toLocaleString('es-ES');
                        const accion = log.accion || log.tipo || '-';
                        const badgeClass = accion.includes('ENTRADA') ? 'badge-stock' : accion.includes('SALIDA') ? 'badge-danger' : 'badge-warning';
                        html += `
                            <div class="pie-tabla fila fila-entre">
                                <div class="fila">
                                    <span class="badge ${badgeClass}">${esc(accion)}</span>
                                    <p class="texto-suave texto-chico">${esc(log.detalles || log.usuarioEmail || 'Sin detalles')}</p>
                                </div>
                                <p class="texto-suave texto-chico nowrap">${date}</p>
                            </div>
                        `;
                    });
                    html += '</div>';
                    recentEl.innerHTML = html;
                } else {
                    document.getElementById('recentActivity').innerHTML = '<h3>Actividad Reciente</h3><p class="texto-suave mt-1">No hay actividad registrada aún.</p>';
                }
            }

        });
    </script>
</body>
</html>
