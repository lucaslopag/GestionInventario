server:
  port: 8081  # Puerto interno para el MS de usuarios

spring:
  application:
    name: ms-users
  
  datasource:
    url: jdbc:mysql://localhost:3306/db_users?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${MYSQL_USER:appuser}
    password: ${MYSQL_PASSWORD:apppassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:rabbit}
    password: ${RABBITMQ_PASSWORD:rabbitpassword}
    template:
      exchange: ""
      routing-key: ${RABBITMQ_QUEUE_MAIL:cola.mails}
    queues:
      mail: ${RABBITMQ_QUEUE_MAIL:cola.mails}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# Configuración personalizada para JWT (usará el .env)
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:3600000}
