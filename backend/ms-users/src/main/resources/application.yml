server:
  port: 8081
  error:
    include-message: always

spring:
  application:
    name: ms-users
  
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/db_users?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${MYSQL_USER:tfg}
    password: ${MYSQL_PASSWORD:tfg1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    template:
      exchange: ""
      routing-key: ${RABBITMQ_QUEUE_MAIL:cola.mails}
    queues:
      mail: ${RABBITMQ_QUEUE_MAIL:cola.mails}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# Configuración personalizada para JWT (usará el .env)
jwt:
  secret: ${JWT_SECRET:cambia_este_secreto_usando_la_variable_JWT_SECRET_y_pon_uno_propio_de_64_caracteres_o_mas}
  expiration: ${JWT_EXPIRATION_MS:3600000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5500}
