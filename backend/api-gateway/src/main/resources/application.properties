# Servidor
server.port=8080
spring.application.name=api-gateway
# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# JWT Secret (el mismo que en ms-users). En local se define con la variable JWT_SECRET
jwt.secret=${JWT_SECRET:cambia_este_secreto_usando_la_variable_JWT_SECRET_y_pon_uno_propio_de_64_caracteres_o_mas}
# Rutas a microservicios
#ms-users
spring.cloud.gateway.routes[0].id=ms-users
spring.cloud.gateway.routes[0].uri=lb://ms-users
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
#ms-catalog
spring.cloud.gateway.routes[1].id=ms-catalog
spring.cloud.gateway.routes[1].uri=lb://ms-catalog
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/productos/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
#ms-suppliers
spring.cloud.gateway.routes[2].id=ms-suppliers
spring.cloud.gateway.routes[2].uri=lb://ms-suppliers
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/proveedores/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1
#ms-inventory
spring.cloud.gateway.routes[3].id=ms-inventory
spring.cloud.gateway.routes[3].uri=lb://ms-inventory
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/inventario/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1
#ms-audit
spring.cloud.gateway.routes[4].id=ms-audit
spring.cloud.gateway.routes[4].uri=lb://ms-audit
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/auditoria/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1
#ms-users (gestion de usuarios - admin)
spring.cloud.gateway.routes[5].id=ms-users-admin
spring.cloud.gateway.routes[5].uri=lb://ms-users
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/usuarios/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=1
