version: '3.8'

# Red interna: todos los contenedores se ven entre sí por nombre
networks:
  tfg-net:
    driver: bridge

# Volúmenes: los datos se guardan en disco (no se pierden al reiniciar)
volumes:
  mysql-data:
  rabbitmq-data:

services:

  # ---------------------------------------------------------
  # MYSQL 8.0 — Base de datos relacional
  # - Lee las credenciales del fichero .env
  # - Monta ./db-scripts en la carpeta especial de MySQL
  #   que ejecuta los .sql automáticamente la 1ª vez
  # - Puerto 3306 abierto para conectar desde herramientas locales
  # ---------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: tfg-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql # datos persistentes
      - ./db-scripts:/docker-entrypoint-initdb.d # scripts SQL automáticos
    networks:
      - tfg-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------
  # RABBITMQ — Broker de mensajería
  # - Puerto 5672: conexión AMQP (usado por los microservicios)
  # - Puerto 15672: interfaz web para ver colas y mensajes
  #   → Abrir en navegador: http://localhost:15672
  # ---------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: tfg-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - tfg-net
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
